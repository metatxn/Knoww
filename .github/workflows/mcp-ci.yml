name: MCP CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "packages/knoww-services/**"
      - "packages/logger/**"
      - "packages/shared-types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "biome.json"
      - ".github/workflows/mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Lint MCP and shared services
        run: |
          pnpm --filter @knoww/mcp lint
          pnpm --filter @knoww/services lint

      - name: Typecheck affected applications
        run: |
          pnpm --filter @knoww/mcp typecheck
          pnpm --filter @knoww/services typecheck
          pnpm --filter @knoww/web typecheck
          pnpm --filter @knoww/extension typecheck

      - name: Run affected tests
        run: |
          pnpm --filter @knoww/mcp test
          pnpm --filter @knoww/services test
          pnpm --filter @knoww/web exec vitest run src/app/api/search/route.test.ts
          pnpm --filter @knoww/extension test

      - name: Check generated Worker bindings
        run: pnpm check:mcp-bindings

      - name: Validate release files
        run: |
          node --test apps/mcp/scripts/test-mcp-registry.mjs
          bash -n apps/mcp/scripts/curl-smoke-test.sh
          git diff --check

      - name: Build production Worker bundle
        run: pnpm build:mcp

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  publish-registry:
    needs: quality
    if: >-
      github.repository == 'metatxn/Knoww' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare registry metadata
        id: metadata
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-registry"
          export MCP_COMMIT_TIMESTAMP="$(git show -s --format=%ct HEAD)"
          node apps/mcp/scripts/mcp-registry.mjs prepare \
            apps/mcp/server.json "$RUNNER_TEMP/mcp-registry/server.json"

      - name: Install verified MCP publisher
        if: steps.metadata.outputs.publish_required == 'true'
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          cd "$RUNNER_TEMP/mcp-registry"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            --output publisher.tar.gz
          printf '%s  publisher.tar.gz\n' "$PUBLISHER_SHA256" | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher

      - name: Authenticate and publish with GitHub OIDC
        if: steps.metadata.outputs.publish_required == 'true'
        run: |
          cd "$RUNNER_TEMP/mcp-registry"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

      - name: Verify registry listing
        run: |
          node apps/mcp/scripts/mcp-registry.mjs verify \
            "$RUNNER_TEMP/mcp-registry/server.json"
